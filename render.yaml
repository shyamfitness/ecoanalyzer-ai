services:
  - type: web
    name: ecoanalyzer-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: ecoanalyzer
      - key: OPENAI_MODEL
        value: gpt-4o-mini

